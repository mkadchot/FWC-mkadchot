<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <div class="card">
    <!-- Header อยู่ด้านบนสุด -->
    <div class="card-header">
      <h2>Profile</h2>
    </div>

    <!-- ใช้ Invisible Table จัดวางเนื้อหา -->
    <table class="profile-table">
      <tr>
        <td>
          <img src="https://i.pinimg.com/236x/5f/02/b3/5f02b38b95def3c23832c242664ccf97.jpg" alt="Profile Picture" class="profile-img">
        </td>
      </tr>
      <tr>
        <td class="login-name">Bangkok</td>
      </tr>
      <tr>
        <td class="description">Mintra KAdchoti</td>
      </tr>
      <tr>
        <td class="social-links">
          <a href="https://www.instagram.com/_martinwoodz/"><img src="https://img.magnific.com/premium-vector/instagram-vector-logo-icon-social-media-logotype_901408-392.jpg?semt=ais_hybrid&w=740&q=80" alt="Instagram"></a>
          <a href="https://discord.com/channels/@me"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJ-NBVOpOY2m0EyEvhjWdPv9v9ieJDiqXqrSMzS2qX_DC8lOUxhF57K8Se&s=10" alt="Discord"></a>
        </td>
      </tr>
      <tr>
        <td>
          <button class="contact-btn">Contact</button>
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
